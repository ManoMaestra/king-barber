<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>King Barber</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --card:#161514; --card2:#1f1d1a; --line:#2c2924;
  --gold:#d4a537; --gold2:#f3d27a; --gold3:#9c7420;
  --txt:#f2ede3; --mut:#9a9389; --ok:#4caf6e; --bad:#e0574f; --wa:#25d366;
  --gradGold:linear-gradient(135deg,#f6dc8c 0%,#d4a537 45%,#9c7420 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;
  background:radial-gradient(circle at 50% -10%,#2a2215 0%,transparent 55%),var(--bg)}
h1,h2,h3,.serif{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
.goldtxt{background:var(--gradGold);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(11,11,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);object-position:50% 45%}
header .t{flex:1}
header h1{margin:0;font-size:18px}
header small{color:var(--mut);font-size:12px}
.streak{display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--gold3);
  padding:6px 10px;border-radius:20px;font-weight:700;color:var(--gold2)}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px}
.kpi.big{grid-column:1/-1;border-color:var(--gold3);background:linear-gradient(160deg,#241d10,#141210)}
.kpi.big .v{font-size:30px}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{font-size:12px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--gold3);
  display:grid;place-items:center;font-weight:700;color:var(--gold2);flex-shrink:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font:600 15px Inter,sans-serif;cursor:pointer;
  background:var(--gradGold);color:#1a1205;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:#05210f}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.del{background:transparent;color:var(--bad);border:1px solid #4a2321}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mut);
  white-space:nowrap;font-weight:600;font-size:13px;cursor:pointer}
.tab.on{background:var(--gradGold);color:#1a1205;border-color:transparent}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(14,13,12,.97);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 10.5px Inter;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--gold)}
nav .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;
  border-radius:10px;padding:1px 5px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:60px;height:60px;
  border-radius:50%;border:0;background:var(--gradGold);color:#1a1205;font-size:32px;font-weight:300;
  box-shadow:0 6px 24px rgba(212,165,55,.35);cursor:pointer}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:#121110;border-top:2px solid var(--gold3);border-radius:20px 20px 0 0;width:100%;max-width:640px;
  max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grabzone{position:sticky;top:0;z-index:2;background:#121110;padding:8px 0 10px;margin:0 -16px 4px;touch-action:none;cursor:grab}
.sheet .grab{width:44px;height:5px;background:#4a453d;border-radius:4px;margin:0 auto}
.sheet .x{position:absolute;right:12px;top:4px;background:var(--card2);border:1px solid var(--line);color:var(--mut);
  width:32px;height:32px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}
body.noscroll{overflow:hidden}
.sheet h2{font-size:18px;margin:0 0 14px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px;font-weight:600}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px;font:16px Inter,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:13px}
.chip.on{border-color:var(--gold);color:var(--gold2);background:#231c0e}
.chip small{display:block;color:var(--mut);font-weight:500}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px 10px;color:var(--txt);
  font:600 14px Inter;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.quick button span{font-size:26px}
.empty{text-align:center;color:var(--mut);padding:18px 6px;font-size:14px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gradGold)}
.stamps{letter-spacing:2px;font-size:15px}
.pill{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.gold{color:var(--gold2);border-color:var(--gold3)}
.pill.red{color:#ffb4ae;border-color:#5a2a27}
.days{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.days i{display:block;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--line);margin-bottom:4px;
  display:grid;place-items:center;font-style:normal}
.days i.on{background:var(--gradGold);border:0;color:#1a1205}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal .m{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);cursor:pointer}
.gal .m img,.gal .m video{width:100%;height:100%;object-fit:cover;display:block}
.gal .m span{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:6px}
.ultimo{width:100%;max-height:340px;object-fit:cover;border-radius:12px;display:block;background:#000}
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;border:1px solid var(--gold3);min-height:150px;
  background:url(logo.jpg) center 42%/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.85))}
.hero div{position:absolute;left:14px;right:14px;bottom:12px;z-index:1}
.hero b{font-size:13px;color:var(--gold2)}
.hero p{margin:2px 0 0;font-size:22px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--gold);color:var(--txt);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;
  display:none;max-width:90vw;text-align:center}
.flex{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mt{margin-top:10px}
.mut{color:var(--mut);font-size:12px}
.search{margin-bottom:10px}
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="King Barber">
  <div class="t"><h1 class="goldtxt">KING BARBER</h1><small id="hdrDate"></small></div>
  <div class="streak" id="hdrStreak" onclick="go('inicio')">🔥 <span>0</span></div>
</header>
<main id="view"></main>
<button class="fab" onclick="quickMenu()" aria-label="Agregar">+</button>
<nav id="nav"></nav>
<div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="importIn" accept="application/json" hidden>
<input type="file" id="ssIn" accept="image/*" hidden>

<script>
/* ====================== DATOS ====================== */
const KEY='kingbarber_v1';
const DEF={
  clientes:[], ventas:[], gastos:[], citas:[], fotos:[], actividad:{}, productos:[], media:[], mensualidades:[],
  planes:[{id:'pm1',n:'Corte',p:35000,cortes:4,dias:30},{id:'pm2',n:'Corte + Barba',p:45000,cortes:4,dias:30}],
  trivia:{cur:null,usadas:[],ok:0,mal:0,dia:null,res:null},
  servicios:[{n:'Corte',p:10000},{n:'Corte + Barba',p:14000},{n:'Barba',p:6000},{n:'Corte niño',p:8000},{n:'Diseño / Líneas',p:3000}],
  inventario:[
    {id:'navajas',n:'Navajas',stock:200,min:30,u:'un',porCorte:1},
    {id:uid(),n:'Cera',stock:6,min:2,u:'un',porCorte:0},
    {id:uid(),n:'Shampoo',stock:3,min:1,u:'un',porCorte:0}
  ],
  cfg:{diasInactivo:14,sellos:10,nombre:'King Barber',premios:[{n:5,p:'Ceja gratis'},{n:10,p:'Corte gratis'}],
    msgVuelta:'Hola {nombre}! 💈 Hace {dias} días que no pasas por King Barber. ¿Te agendo un corte esta semana? 👑',
    msgCumple:'¡Feliz cumpleaños {nombre}! 🎉👑 De regalo en King Barber tienes 20% de descuento en tu corte este mes.',
    msgRecordatorio:'Hola {nombre}! 💈 Te recuerdo tu hora en King Barber mañana {fecha} a las {hora}. ¡Te espero! 👑',
    msgFiado:'Hola {nombre}! 👑 Te recuerdo que quedó pendiente {monto} en King Barber. Cuando puedas me transfieres 🙏💈',
    msgMens:'Hola {nombre}! 👑 Tu mensualidad King Barber ({plan}) comienza el {inicio}. Son {cortes} cortes desde el {inicio} hasta el {fin}. ¡Te espero! 💈',
    msgSello:'¡Gracias {nombre}! 👑 Tu tarjeta King Barber:\n{sellos}\nLlevas {n} de {meta}. {falta}\nGuarda este número para agendar 💈'}
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
if(!db){db=JSON.parse(JSON.stringify(DEF))}
for(const k in DEF){if(db[k]===undefined)db[k]=JSON.parse(JSON.stringify(DEF[k]))}
for(const k in DEF.cfg){if(db.cfg[k]===undefined)db.cfg[k]=DEF.cfg[k]}
/* Migración: perfumes y ceras cargados como ventas pasan a la Tienda. */
function migrar(){
  if(!db.productos)db.productos=[];
  if(!db.cfg.migTienda){db.ventas.forEach(v=>{if(!v.tipo&&/perfume|cera/i.test(v.servicio||'')){v.tipo='producto';v.cant=1;v.costo=0;v.unit=+v.monto||0}});db.cfg.migTienda=1}
}
migrar();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){toast('⚠️ Memoria llena: borra fotos antiguas o exporta respaldo')}
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ====================== UTILS ====================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dkey(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq=s=>esc(JSON.stringify(String(s??'')));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fmtD=s=>{const d=parseD(s);return `${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`};
const cli=id=>db.clientes.find(c=>c.id===id);
const ini=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function phone(t){let d=String(t||'').replace(/\D/g,'');if(d.length===8)d='9'+d;if(d.length===9)d='56'+d;return d}
function wa(tel,msg){
  const p=phone(tel);if(!p){toast('Cliente sin teléfono');return false}
  window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg)}`,'_blank');return true}
function fill(t,o){return t.replace(/\{(\w+)\}/g,(m,k)=>o[k]??m)}
/* Frecuencia de corte: mediana de los días entre sus últimos cortes (hasta 6 intervalos). Necesita 2 cortes en días distintos. */
function frecuencia(id){const F=[...new Set(db.ventas.filter(v=>v.clienteId===id&&esCorte(v)).map(v=>v.fecha))].sort().slice(-7);
  if(F.length<2)return null;const g=[];for(let i=1;i<F.length;i++)g.push(diffDays(F[i-1],F[i]));g.sort((a,b)=>a-b);
  const m=g.length%2?g[(g.length-1)/2]:(g[g.length/2-1]+g[g.length/2])/2;return Math.max(1,Math.round(m))}
/* Atrasado: pasó su frecuencia + 20% (mín. 3 días de margen). Sin frecuencia, usa los días de inactividad configurados. */
const limiteDias=id=>{const f=frecuencia(id);return f?Math.max(f+3,Math.round(f*1.2)):db.cfg.diasInactivo};
const atrasado=(id,lv)=>!!lv&&diffDays(lv,today())>limiteDias(id);
function lastVisit(id){let m=null;for(const v of db.ventas)if(v.clienteId===id&&(!m||v.fecha>m))m=v.fecha;return m}
/* Tarjeta de fidelidad: cuenta solo desde que Diego la inicia para ese cliente (c.tarjetaTs).
   Sellos = cortes pagados desde el inicio − cortes gratis ya canjeados × meta. Con sellos ≥ meta, el próximo es gratis. */
/* Premios de la tarjeta (configurables): el corte número n trae el premio p. El último (meta) es el corte gratis y
   reinicia la tarjeta. visits() = sellos de la tarjeta actual (1..meta); tras completar, el siguiente corte vuelve a 1. */
const premios=()=>[...(db.cfg.premios||[])].filter(x=>+x.n>0).sort((a,b)=>a.n-b.n);
const meta=()=>Math.max(2,...premios().map(x=>+x.n));
const premioEn=n=>premios().find(x=>+x.n===n);
function visits(id){const c=cli(id);if(!c||!c.tarjetaTs)return 0;
  const t=db.ventas.filter(v=>v.clienteId===id&&esCorte(v)&&(+v.ts||0)>=c.tarjetaTs).length;
  return t?((t-1)%meta())+1:0}
const proximo=id=>{const n=visits(id);return n>=meta()?1:n+1};
const tieneTarjeta=id=>!!(cli(id)||{}).tarjetaTs;
function iniciarTarjeta(id,ts){const c=cli(id);c.tarjetaTs=ts||Date.now();save();render();
  if(c.tel)openSheet(`<h2 class="goldtxt">⭐ Tarjeta iniciada</h2><div class="card"><div class="stamps">${sellos(visits(id))}</div><div class="mut mt">${esc(c.nombre)} lleva ${visits(id)} de ${meta()}</div></div>
    <button class="btn wa block" onclick="waSello('${id}');closeSheet()">💬 Enviar tarjeta por WhatsApp</button><button class="btn sec block mt" onclick="closeSheet()">Ahora no</button>`);
  else{closeSheet();toast('⭐ Tarjeta iniciada')}}
function reiniciarTarjeta(id){if(!confirm('¿Reiniciar la tarjeta? Los sellos vuelven a 0.'))return;iniciarTarjeta(id,Date.now())}
function mark(tipo){db.actividad[today()]=db.actividad[today()]||[];if(!db.actividad[today()].includes(tipo))db.actividad[today()].push(tipo)}
// La racha avanza con cualquier registro del día (venta, gasto, cita) o con la pregunta del día bien respondida.
const okDay=d=>Array.isArray(db.actividad[d])&&db.actividad[d].some(t=>['venta','gasto','cita','trivia'].includes(t));
function streak(){
  let n=0,d=today();
  if(!okDay(d))d=addDays(d,-1);
  while(okDay(d)){n++;d=addDays(d,-1)}
  return n}
function bestStreak(){
  const ks=Object.keys(db.actividad).filter(okDay).sort();let b=0,c=0,prev=null;
  for(const k of ks){c=(prev&&diffDays(prev,k)===1)?c+1:1;b=Math.max(b,c);prev=k}return b}
function monthSum(arr,ym,f){return arr.filter(x=>x.fecha.startsWith(ym)).reduce((s,x)=>s+f(x),0)}
const MEDIOS=['Efectivo','Transferencia','Tarjeta','Fiado'];
/* Fiado: venta hecha pero no pagada. Queda como deuda del cliente hasta marcarla pagada. */
const deuda=id=>db.ventas.filter(v=>v.clienteId===id&&v.pago==='Fiado').reduce((s,v)=>s+ventaTotal(v),0);
const fiados=()=>db.clientes.map(c=>({c,m:deuda(c.id)})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m);
/* Cumpleaños con día y mes (sin año: más fácil en el celular). Se guarda como 2000-MM-DD. */
function cumpleInputs(pre,v){const d=v?+v.slice(8,10):0,m=v?+v.slice(5,7):0;
  return `<div class="grid2"><select id="${pre}D"><option value="">Día</option>${Array.from({length:31},(_,i)=>`<option ${i+1===d?'selected':''}>${i+1}</option>`).join('')}</select>
  <select id="${pre}M"><option value="">Mes</option>${MES.map((x,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${x}</option>`).join('')}</select></div>`}
function cumpleVal(pre){const d=+val(pre+'D'),m=+val(pre+'M');return d&&m?`2000-${pad(m)}-${pad(d)}`:''}
/* Corte = venta de servicio. No lo son los productos de la tienda ni el pago de una mensualidad. */
const esCorte=v=>v.tipo!=='producto'&&v.tipo!=='mensualidad';
const ventaTotal=v=>(v.gratis?0:+v.monto||0)+(+v.propina||0);
const pn=p=>p?(p.n+(p.det?' '+p.det:'')):'Producto';
const prod=id=>db.productos.find(p=>p.id===id);
/* Resumen de un período (pre = 'YYYY-MM' o 'YYYY'). Barbería: ventas de servicios − costos del negocio.
   Tienda: ventas de productos − costo de lo vendido − otros gastos de tienda (las compras de mercadería se informan aparte). */
/* Mes anterior para comparar. Si se mira el mes en curso, se compara hasta el mismo día del mes pasado (comparación justa). */
function mesPrevio(ym){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);const pym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  let hasta=null;if(ym===today().slice(0,7)){const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();hasta=`${pym}-${pad(Math.min(+today().slice(8),dim))}`}
  return {pym,hasta,R:resumenMes(pym,hasta),txt:`vs ${MES[d.getMonth()]}${hasta?' al '+(+hasta.slice(8)):''}`}}
/* Flecha de variación. inv=true cuando subir es malo (costos, gastos). */
function delta(cur,prev,txt,inv){
  if(!prev&&!cur)return `<div class="mut" style="font-size:11px;margin-top:3px">— ${txt}</div>`;
  if(!prev)return `<div style="font-size:11px;margin-top:3px;color:${inv?'var(--bad)':'var(--ok)'}">▲ nuevo ${txt}</div>`;
  const pc=Math.round((cur-prev)/Math.abs(prev)*100);const up=pc>0;const good=pc===0?null:(up!==!!inv);
  return `<div style="font-size:11px;margin-top:3px;color:${good===null?'var(--mut)':good?'var(--ok)':'var(--bad)'}">${pc===0?'=':up?'▲':'▼'} ${Math.abs(pc)}% ${txt}</div>`}
function resumenMes(pre,hasta){return resumenEn(x=>x.fecha.startsWith(pre)&&(!hasta||x.fecha<=hasta))}
const resumenRango=(d,h)=>resumenEn(x=>x.fecha>=d&&x.fecha<=h);
/* Período elegido en Resumen: mes (flechas), 2m/3m/6m (meses completos hasta hoy), año, o personalizado.
   Se compara contra el período anterior del mismo largo en días. */
function periodo(){const t=today(),k=sub.per||'mes';let d,h=t,nom;
  const iniMes=n=>{const x=new Date(+t.slice(0,4),+t.slice(5,7)-1-n,1);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-01`};
  if(k==='mes')return null;
  if(k==='2m'){d=iniMes(1);nom='Últimos 2 meses'}else if(k==='3m'){d=iniMes(2);nom='Últimos 3 meses'}
  else if(k==='6m'){d=iniMes(5);nom='Últimos 6 meses'}else if(k==='anio'){d=t.slice(0,4)+'-01-01';nom='Este año'}
  else{d=sub.pd||iniMes(1);h=sub.ph||t;if(d>h)[d,h]=[h,d];nom='Personalizado'}
  const largo=diffDays(d,h)+1,ph=addDays(d,-1),pd=addDays(d,-largo);
  return {d,h,nom,R:resumenRango(d,h),P:resumenRango(pd,ph),txt:`vs ${fmtD(pd)} – ${fmtD(ph)}`}}
function setPer(k){sub.per=k;render()}
function resumenEn(en){
  const V=db.ventas.filter(en),G=db.gastos.filter(en);
  const VB=V.filter(v=>v.tipo!=='producto'),VT=V.filter(v=>v.tipo==='producto');
  const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
  const b={ing:sum(VB,ventaTotal),cos:sum(G.filter(g=>g.tipo==='negocio'),g=>g.monto),n:VB.filter(esCorte).length};b.util=b.ing-b.cos;
  const GT=G.filter(g=>g.tipo==='tienda');
  const t={ing:sum(VT,ventaTotal),cogs:sum(VT,v=>v.costo),otros:sum(GT.filter(g=>g.cat!=='Mercadería'),g=>g.monto),
    compras:sum(GT.filter(g=>g.cat==='Mercadería'),g=>g.monto),n:sum(VT,v=>v.cant||1)};t.util=t.ing-t.cogs-t.otros;
  const per=sum(G.filter(g=>g.tipo==='personal'),g=>g.monto);
  return {b,t,per,ing:b.ing+t.ing,util:b.util+t.util,V,VB,VT,G}}

/* Búsqueda sin mayúsculas ni tildes; filtra la lista mientras se escribe, sin redibujar la pantalla. */
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function filtrarClientes(v){sub.q=v;const q=normTxt(v.trim());let n=0;
  document.querySelectorAll('.cliRow').forEach(r=>{const ok=!q||r.dataset.k.includes(q)||r.dataset.k.replace(/\D/g,'').includes(q.replace(/\D/g,'')||'\u0000');r.style.display=ok?'':'none';if(ok)n++});
  const e=$('#cliVacio');if(e)e.style.display=n||!db.clientes.length?'none':'block'}

function pendientesWA(){
  const t=today(),man=addDays(t,1),md=t.slice(5);
  const rec=db.citas.filter(c=>c.fecha===man&&!c.recordado);
  const cum=db.clientes.filter(c=>c.cumple&&c.cumple.slice(5)===md&&c.cumpleEnviado!==t.slice(0,4));
  const ina=db.clientes.map(c=>({c,lv:lastVisit(c.id)})).filter(({c,lv})=>{
    if(!atrasado(c.id,lv))return false;
    if(c.ultContacto&&c.ultContacto>lv&&diffDays(c.ultContacto,t)<7)return false;return true})
    .sort((a,b)=>a.lv.localeCompare(b.lv));
  const prox=db.clientes.filter(c=>{if(!c.cumple)return false;let dd=diffDays(t,t.slice(0,4)+'-'+c.cumple.slice(5));if(dd<0)dd=diffDays(t,(+t.slice(0,4)+1)+'-'+c.cumple.slice(5));return dd>0&&dd<=7});
  return {rec,cum,ina,prox,total:rec.length+cum.length+ina.length}}

/* ====================== SHEETS / FORMS ====================== */
function openSheet(h){window._borrar=false;const sh=$('#sheet');
  sh.innerHTML='<div class="grabzone"><div class="grab"></div><button class="x" onclick="closeSheet()" aria-label="Cerrar">✕</button></div>'+h;
  sh.style.transform='';sh.scrollTop=0;$('#sheetbg').classList.add('open');document.body.classList.add('noscroll')}
/* Deslizar hacia abajo para cerrar: desde la barrita de arriba, o desde cualquier parte si la ventana ya está arriba del todo. */
(()=>{const sh=$('#sheet');let y0=null,dy=0,drag=false,grab=false;
  sh.addEventListener('touchstart',e=>{const t=e.target;
    if(t.closest('input,select,textarea'))return;
    grab=!!t.closest('.grabzone');
    if(grab||sh.scrollTop<=0){y0=e.touches[0].clientY;dy=0;drag=false}},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;
    if(dy>8&&(drag||grab||sh.scrollTop<=0)){drag=true;e.preventDefault();sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`}
    else if(dy<0&&!drag)y0=null},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0==null)return;y0=null;if(!drag)return;
    sh.style.transition='transform .2s ease';
    if(dy>110){sh.style.transform='translateY(100%)';setTimeout(closeSheet,180)}else sh.style.transform='';drag=false});
})();
/* Eliminar venta/gasto en dos pasos: se marca y solo se borra al tocar Guardar. Cerrar sin guardar no borra nada. */
const btnBorrar=()=>`<button class="btn del block mt" id="btnBorrar" onclick="marcarBorrar()">🗑️ Eliminar</button>`;

  b.innerHTML=window._borrar?'↩️ Deshacer: no eliminar':'🗑️ Eliminar';
  g.innerHTML=window._borrar?'Guardar (se eliminará)':g.dataset.txt;
  g.style.background=window._borrar?'var(--bad)':'';g.style.color=window._borrar?'#fff':'';
  if(window._borrar)toast('Toca Guardar para confirmar la eliminación')}
function closeSheet(){$('#sheetbg').classList.remove('open');document.body.classList.remove('noscroll');const sh=$('#sheet');sh.style.transform='';sh.style.transition=''}

async function pegarWA(txt,desdeFoto){
  if(txt==null){txt='';try{txt=await navigator.clipboard.readText()}catch(e){}}

  <button class="btn block mt" onclick="leerWA()">Leer día y hora</button>`);
}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
/* Captura de pantalla -> texto (OCR en el teléfono con Tesseract, se descarga la primera vez) */
let _tess=null;
function cargarTesseract(){return _tess||(_tess=new Promise((ok,ko)=>{const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>{_tess=null;ko()};document.head.appendChild(s)}))}
async function leerCaptura(blob){
  openSheet(`<h2 class="goldtxt">Leyendo captura…</h2><div class="empty">🔍 Esto toma unos segundos.<br>La primera vez necesita internet.</div><div class="bar"><i id="ocrBar" style="width:5%"></i></div>`);
  try{
    await cargarTesseract();
    const r=await Tesseract.recognize(blob,'spa',{logger:m=>{const b=$('#ocrBar');if(b&&m.status==='recognizing text')b.style.width=Math.max(5,m.progress*100)+'%'}});
    const txt=r.data.text.split('\n').map(l=>l.trim()).filter(Boolean).join('\n');
    if(!txt){toast('No se pudo leer texto en la imagen');closeSheet();return}
    pegarWA(txt,true);
  }catch(e){closeSheet();toast('⚠️ No se pudo leer la captura. Revisa tu conexión.')}
}
function leerWA(){
  const raw=val('pw');
  // Quita la hora de envío de cada mensaje (ej: "17:42 ✓✓") para no confundirla con la hora pedida.
  // No se quita si viene después de "a las", "tipo", etc. (ahí es la hora que pide el cliente).
  const limpio=raw.split('\n').map(l=>l.replace(/(?<!(?:las|la|tipo|de|para)\s*)(?:^|\s+)\d{1,2}[:.]\d{2}\s*(?:[ap]\.?\s?m\.?)?\s*[✓✔vV/]*\s*$/i,'')).join('\n');
  const t=norm(limpio);
  const nt=norm(raw);
  const match=db.clientes.map(c=>({c,full:norm(c.nombre),first:norm(c.nombre).split(' ')[0]}))
    .filter(x=>x.first.length>2).sort((a,b)=>b.full.length-a.full.length)
    .find(x=>nt.includes(x.full)||new RegExp('\\b'+x.first.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(nt));
  const cid=match?match.c.id:'';
  const guess=!cid?(raw.split('\n').map(l=>l.trim()).find(l=>/^[A-Za-zÁÉÍÓÚÑáéíóúñ ]{3,30}$/.test(l)&&!/^(hoy|ayer|en linea|en línea|escribiendo)/i.test(l))||''):'';
  let f=today();
  if(/pasado manana/.test(t))f=addDays(f,2);else if(/manana/.test(t))f=addDays(f,1);
  const dn=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  dn.forEach((d,i)=>{if(new RegExp('\\b'+d+'\\b').test(t)){let n=(i-parseD(today()).getDay()+7)%7||7;f=addDays(today(),n)}});
  const dm=t.match(/\b(\d{1,2})\s*(?:\/|de\s+)(\d{1,2}|ene\w*|feb\w*|mar\w*|abr\w*|may\w*|jun\w*|jul\w*|ago\w*|sep\w*|oct\w*|nov\w*|dic\w*)/);
  if(dm){let m=isNaN(dm[2])?MES.findIndex(x=>dm[2].startsWith(x))+1:+dm[2];if(m>0){let y=+today().slice(0,4);let c=`${y}-${pad(m)}-${pad(+dm[1])}`;if(c<today())c=`${y+1}-${pad(m)}-${pad(+dm[1])}`;f=c}}
  let h='';const hm=t.match(/(?:a las|las|tipo|a la)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/)||t.match(/\b(\d{1,2})[:.](\d{2})\b/)||t.match(/\b(\d{1,2})\s*(am|pm|hrs?)\b/);
  if(hm){let H=+hm[1],M=hm[2]&&!isNaN(hm[2])?+hm[2]:0;const ap=(hm[3]||hm[2]||'');if((/pm/.test(ap)||H<9)&&H<12)H+=12;h=`${pad(H)}:${pad(Math.min(45,Math.round(M/15)*15))}`}
  closeSheet();setTimeout(()=>{formCita(null,f,cid);if(guess&&$('#aN'))$('#aN').value=guess;if(h){$('#aHx').value=h;paintHoras()}
    toast(`Leído: ${cid?cli(cid).nombre+' · ':''}${fmtD(f)}${h?' '+h:' (elige hora)'}`)},200);
}

/* ====================== FOTOS Y VIDEOS DEL CLIENTE ======================
   Los archivos se guardan en IndexedDB del teléfono (aguanta videos). En db.media solo va la ficha liviana:
   {id, clienteId, ventaId, fecha, tipo:'foto'|'video'}. El respaldo JSON las incluye en base64 (videos opcionales). */
const IDB=new Promise((ok,ko)=>{const r=indexedDB.open('kingbarber-media',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
async function idbDo(mode,fn){const d=await IDB;return new Promise((ok,ko)=>{const tx=d.transaction('media',mode);const st=tx.objectStore('media');const q=fn(st);
  tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>ko(tx.error)})}
const _urls={};
async function mediaURL(id){if(_urls[id])return _urls[id];const b=await idbDo('readonly',st=>st.get(id));if(!b)return null;return _urls[id]=URL.createObjectURL(b)}
function comprimir(file){return new Promise(ok=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b||file),'image/jpeg',.75)};
  img.onerror=()=>ok(file);img.src=u})}
async function guardarMedia(files,clienteId,ventaId,fecha){let n=0;
  for(const f of files){const video=f.type.startsWith('video');
    if(video&&f.size>80*1024*1024){toast('⚠️ Video muy pesado (máx. 80 MB). Grábalo más corto.');continue}
    const blob=video?f:await comprimir(f);const id=uid();
    try{await idbDo('readwrite',st=>st.put(blob,id))}catch(e){toast('⚠️ No hay espacio para guardar el archivo');continue}
    db.media.push({id,clienteId,ventaId:ventaId||'',fecha:fecha||today(),tipo:video?'video':'foto'});n++}
  save();return n}
const mediaDe=cid=>db.media.filter(m=>m.clienteId===cid).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.id>a.id?1:-1));
async function pintarMedia(root){for(const el of (root||document).querySelectorAll('[data-mid]')){const u=await mediaURL(el.dataset.mid);if(u)el.src=u}}
const tagMedia=(m,cls)=>m.tipo==='video'?`<video data-mid="${m.id}" class="${cls||''}" muted playsinline preload="metadata"></video>`:`<img data-mid="${m.id}" class="${cls||''}" alt="">`;
/* Historial de cortes en fotos: una tarjeta por día de corte, del más reciente al más antiguo, con servicio y notas. */
function verFotos(cid){const c=cli(cid);const M=mediaDe(cid);window._volver=()=>verFotos(cid);
  const dias={};M.forEach(m=>(dias[m.fecha]=dias[m.fecha]||[]).push(m));
  const F=Object.keys(dias).sort().reverse();
  openSheet(`<h2 class="goldtxt">Cortes de ${esc(c.nombre.split(' ')[0])}</h2>
  <div class="between" style="margin-bottom:6px"><span class="mut">${F.length} corte(s) con foto · ${M.length} archivo(s)</span><button class="btn sm sec" onclick="subirMediaCliente('${cid}')">+ Subir</button></div>
  ${F.length?F.map((f,i)=>{const sv=db.ventas.filter(v=>v.clienteId===cid&&v.fecha===f&&esCorte(v)).map(v=>v.servicio);
    return `<div class="card"><div class="between"><h3 style="margin:0">${fmtD(f)}${i===0?' · último':''}</h3><span class="mut">hace ${diffDays(f,today())} días</span></div>
    ${sv.length?`<div class="mut mt">✂️ ${esc([...new Set(sv)].join(', '))}</div>`:''}
    <div class="gal mt" style="${dias[f].length===1?'grid-template-columns:1fr':''}">${dias[f].map(m=>`<div class="m" style="${dias[f].length===1?'aspect-ratio:4/3':''}" onclick="verMedia('${m.id}')">${tagMedia(m)}${m.tipo==='video'?'<span>▶ video</span>':''}</div>`).join('')}</div></div>`}).join('')
  :'<div class="empty">Sin fotos todavía.</div>'}
  <button class="btn sec block mt" onclick="verCliente('${cid}')">← Volver a la ficha</button>`);
  pintarMedia($('#sheet'))}
async function verMedia(id){const m=db.media.find(x=>x.id===id);if(!m)return;const u=await mediaURL(id);
  openSheet(`<h2 class="goldtxt">${esc((cli(m.clienteId)||{}).nombre||'')}</h2><div class="mut" style="margin-bottom:8px">${fmtD(m.fecha)}${m.ventaId?' · '+esc((db.ventas.find(v=>v.id===m.ventaId)||{}).servicio||''):''}</div>
  ${m.tipo==='video'?`<video src="${u}" controls playsinline autoplay class="ultimo" style="max-height:70vh"></video>`:`<img src="${u}" class="ultimo" style="max-height:70vh;object-fit:contain">`}
  <div class="grid2 mt"><button class="btn sec" onclick="(window._volver||(()=>verCliente('${m.clienteId}')))()">← Volver</button><button class="btn del" style="margin:0" onclick="borrarMedia('${id}')">🗑️ Eliminar</button></div>`)}
async function borrarMedia(id){if(!confirm('¿Eliminar esta foto/video?'))return;const m=db.media.find(x=>x.id===id);

function subirMediaCliente(cid){const i=document.createElement('input');i.type='file';i.accept='image/*,video/*';i.multiple=true;

/* ====================== MENSUALIDADES ======================
   Plan (db.planes): nombre, precio, cortes incluidos y días de duración. Al activarlo a un cliente se crea
   db.mensualidades {id,clienteId,planId,plan,precio,cortes,inicio,fin,ventaId} y una venta tipo 'mensualidad'
   por el precio (es la plata que entra). Cada corte que se registra "con mensualidad" va en $0 con mensId. */
const usadosMens=mid=>db.ventas.filter(v=>v.mensId===mid).length;
function mensActiva(cid,fecha,exceptoVenta){fecha=fecha||today();
  return db.mensualidades.filter(m=>m.clienteId===cid&&m.inicio<=fecha&&m.fin>=fecha)
    .find(m=>db.ventas.filter(v=>v.mensId===m.id&&v.id!==exceptoVenta).length<m.cortes)||null}
const mensDe=cid=>db.mensualidades.filter(m=>m.clienteId===cid).sort((a,b)=>b.inicio.localeCompare(a.inicio));
function estadoMens(m){const u=usadosMens(m.id),t=today();
  return m.fin<t?'vencida':u>=m.cortes?'completa':m.inicio>t?'por empezar':'activa'}
function chkMens(){const e=$('#vMs');if(!e)return;const cid=val('vC');const ed=$('#btnGuardar')&&$('#btnGuardar').getAttribute('onclick').match(/saveVenta\('([^']*)'/);
  const vid=ed?ed[1]:'';const vv=vid?db.ventas.find(v=>v.id===vid):null;
  const m=cid?mensActiva(cid,val('vF')||today(),vid):null;
  if(!m){e.innerHTML='';return}
  const u=db.ventas.filter(v=>v.mensId===m.id&&v.id!==vid).length;const on=vv?!!vv.mensId:true;
  e.innerHTML=`<div class="card mt" style="margin-bottom:0;border-color:var(--gold)"><label class="flex" style="margin:0"><input type="checkbox" id="vMsU" style="width:22px;height:22px" ${on?'checked':''} onchange="usarMens()">
    <span><b>📅 Usar mensualidad (${esc(m.plan)})</b><br><span class="mut">Corte ${u+1} de ${m.cortes} · vence ${fmtD(m.fin)} · no suma plata</span></span></label></div>`;
  if(on&&!vv){const ch=[...document.querySelectorAll('#vS .chip')].find(x=>x.dataset.n===m.plan);if(ch)pickServ(ch)}usarMens()}
function usarMens(){const on=$('#vMsU')&&$('#vMsU').checked;const pr=$('#vM');if(!pr)return;
  pr.closest('.grid2').style.opacity=on?.4:1;pr.disabled=on;$('#vPg').style.display=on?'none':'';$('#vPg').previousElementSibling.style.display=on?'none':''}
function formMens(cid){const P=db.planes;if(!P.length){toast('Primero crea un plan en Finanzas → Ajustes');return}

  <label>Plan</label><div class="chips" id="mP">${P.map((x,i)=>`<div class="chip ${i?'':'on'}" data-i="${i}" onclick="[...this.parentNode.children].forEach(c=>c.classList.remove('on'));this.classList.add('on');mensPlan()">${esc(x.n)}<small>${money(x.p)}</small></div>`).join('')}</div>
  <div class="grid2"><div><label>Precio</label><input id="mPr" type="number" inputmode="numeric"></div><div><label>Cortes</label><input id="mCo" type="number" inputmode="numeric" oninput="mensFin()"></div></div>

function mensPlan(){const x=db.planes[+$('#mP .on').dataset.i];$('#mPr').value=x.p;$('#mCo').value=x.cortes;$('#mDi').value=x.dias;mensFin()}

  ${c.tel?`<button class="btn wa block" onclick="waMens('${m.id}');closeSheet()">💬 Enviar mensaje al cliente</button>`:'<div class="mut">El cliente no tiene WhatsApp guardado.</div>'}
  <button class="btn sec block mt" onclick="verCliente('${cid}')">Ver ficha</button>`)}
function waMens(mid){const m=db.mensualidades.find(x=>x.id===mid);const c=cli(m.clienteId);const u=usadosMens(mid);

  if(u)msg+=`\nLlevas ${u} de ${m.cortes} cortes. ${u>=m.cortes?'¡Completaste tu mensualidad! 👑':`Te quedan ${m.cortes-u} hasta el ${fmtD(m.fin)}.`}`;

  db.mensualidades=db.mensualidades.filter(x=>x.id!==mid);save();render();verCliente(m.clienteId);toast('Mensualidad eliminada')}

    :'<div class="mut mt">Sin mensualidad activa.</div>'}
  ${M.filter(m=>m!==act).slice(0,4).map(m=>`<div class="between mt"><span class="mut">${esc(m.plan)} · ${fmtD(m.inicio)} – ${fmtD(m.fin)} · ${usadosMens(m.id)}/${m.cortes}</span>${tag(m)}</div>`).join('')}</div>`}
function formPlan(i){const x=i!==undefined?db.planes[i]:{n:'',p:'',cortes:4,dias:30};
  openSheet(`<h2 class="goldtxt">📅 Plan de mensualidad</h2><label>Nombre</label><input id="plN" value="${esc(x.n)}" placeholder="Ej: Corte + Barba">

function regCompra(p,cant,cu){ // registra lo pagado como gasto de la tienda
  if(cant>0&&cu>0)db.gastos.push({id:uid(),tipo:'tienda',monto:cant*cu,cat:'Mercadería',desc:`Compra: ${pn(p)} ×${cant}`,fecha:today(),productoId:p.id})}
function ajProd(id,n){const p=prod(id);p.stock=Math.max(0,+p.stock+n);save();render()}

function formVentaProd(id,pre){
  const v=id?db.ventas.find(x=>x.id===id):{fecha:today(),pago:'Efectivo',cant:1,...(pre||{})};
  const P=[...db.productos].sort((a,b)=>pn(a).localeCompare(pn(b)));
  if(!P.length&&!id){openSheet(`<h2 class="goldtxt">Venta de producto</h2><div class="empty">Aún no hay productos en la tienda.</div><button class="btn block" onclick="formLlego()">📦 Cargar mercadería</button>`);return}
  openSheet(`<h2 class="goldtxt">${id?'Editar venta':'Nueva venta'}</h2>
  ${id?'':`<div class="tabs"><div class="tab" onclick="formVenta(null,{clienteId:val('pC')})">✂️ Servicio</div><div class="tab on">👕 Producto</div></div>`}
  <label>Producto</label><div class="chips" id="pS">${P.map(x=>{const disp=x.stock+(id&&v.productoId===x.id?+v.cant:0);
    return `<div class="chip ${x.id===v.productoId?'on':''}" data-id="${x.id}" data-p="${+x.precio||0}" style="${disp<=0?'opacity:.35;pointer-events:none':''}" onclick="[...this.parentNode.children].forEach(c=>c.classList.remove('on'));this.classList.add('on');$('#pU').value=this.dataset.p;totProd()">${esc(pn(x))}<small>${money(x.precio)} · quedan ${disp}</small></div>`}).join('')}</div>
  <div class="grid2"><div><label>Cantidad</label><input id="pQ" type="number" inputmode="numeric" min="1" value="${v.cant||1}" oninput="totProd()"></div>
  <div><label>Precio c/u</label><input id="pU" type="number" inputmode="numeric" value="${v.unit??''}" oninput="totProd()"></div></div>
  <div class="between mt"><span class="mut">Total</span><b id="pT" class="pos">$0</b></div>
  <label>Cliente (opcional)</label><select id="pC">${cliOptions(v.clienteId)}</select>
  <label>Pago</label><div class="chips" id="pPg">${MEDIOS.map(x=>`<div class="chip ${x===v.pago?'on':''}" onclick="[...this.parentNode.children].forEach(c=>c.classList.remove('on'));this.classList.add('on')">${x}</div>`).join('')}</div>
  <label>Fecha</label><input id="pF" type="date" value="${v.fecha}">
  <button class="btn block mt" id="btnGuardar" data-txt="Guardar venta" onclick="saveVentaProd('${id||''}')">Guardar venta</button>
  ${id?btnBorrar():''}`);
  totProd();
}
function totProd(){const e=$('#pT');if(e)e.textContent=money((+val('pQ')||0)*(+val('pU')||0))}
function saveVentaProd(id){
  const old=id?db.ventas.find(x=>x.id===id):null;
  if(old&&window._borrar){const p=prod(old.productoId);if(p)p.stock=+p.stock+(+old.cant||1);
    db.ventas=db.ventas.filter(x=>x.id!==id);save();closeSheet();render();toast('🗑️ Venta eliminada, stock devuelto');return}
  const ch=$('#pS .on');
  if(!ch&&old&&!prod(old.productoId)){ // venta migrada o de un producto eliminado: se edita sin tocar stock
    const cant=Math.max(1,Math.floor(+val('pQ')||1)),unit=+val('pU')||0,pg=$('#pPg .on'),cu=(+old.costo||0)/(+old.cant||1);
    Object.assign(old,{servicio:String(old.servicio||'Producto').replace(/ ×\d+$/,'')+(cant>1?' ×'+cant:''),cant,unit,monto:unit*cant,costo:cu*cant,clienteId:val('pC'),pago:pg?pg.textContent:'Efectivo',fecha:val('pF')||old.fecha});
    save();closeSheet();render();toast('✅ Venta guardada');return}
  if(!ch){toast('Elige un producto');return}
  const p=prod(ch.dataset.id);const cant=Math.max(1,Math.floor(+val('pQ')||1));const unit=+val('pU')||0;
  const disp=+p.stock+(old&&old.productoId===p.id?+old.cant||1:0);
  if(cant>disp){toast(`Solo quedan ${disp} de ${pn(p)}`);return}
  if(old){const op=prod(old.productoId);if(op)op.stock=+op.stock+(+old.cant||1)}
  p.stock=+p.stock-cant;
  const pg=$('#pPg .on');
  if(pg&&pg.textContent==='Fiado'&&!val('pC')){toast('Para fiar, elige el cliente');return}
  const o={tipo:'producto',productoId:p.id,cant,unit,monto:unit*cant,costo:(+p.costo||0)*cant,propina:0,gratis:false,
    servicio:pn(p)+(cant>1?' ×'+cant:''),clienteId:val('pC'),pago:pg?pg.textContent:'Efectivo',fecha:val('pF')||today()};
  if(old)Object.assign(old,o);else{db.ventas.push({id:uid(),ts:Date.now(),...o});mark('venta')}
  save();closeSheet();render();
  toast(+p.stock<=+p.min?`✅ Guardado · ⚠️ quedan ${p.stock} de ${pn(p)}`:'✅ Venta guardada');
}

function formProd(id){
  const p=id?prod(id):{n:'',det:'',costo:'',precio:'',stock:'',min:2};
  openSheet(`<h2 class="goldtxt">${id?esc(pn(p)):'Nuevo producto'}</h2>
  ${id?`<div class="card"><h3>📦 Sumar compra</h3><div class="grid2"><div><label>Cantidad</label><input id="kA" type="number" inputmode="numeric" placeholder="10"></div><div><label>Pagaste c/u</label><input id="kC" type="number" inputmode="numeric" value="${p.costo||''}"></div></div>
    <button class="btn block mt" onclick="compraProd('${id}')">Sumar al stock</button></div>`:''}
  <label>Nombre</label><input id="kN" value="${esc(p.n)}" placeholder="Ej: Polerón negro">
  <label>Talla / color (opcional)</label><input id="kD" value="${esc(p.det||'')}" placeholder="Ej: L">
  <div class="grid2"><div><label>Costo c/u (lo que pagaste)</label><input id="kCo" type="number" inputmode="numeric" value="${p.costo}"></div>
  <div><label>Precio de venta</label><input id="kP" type="number" inputmode="numeric" value="${p.precio}"></div></div>
  <div class="grid2"><div><label>${id?'Stock actual':'Cantidad que llegó'}</label><input id="kS" type="number" inputmode="numeric" value="${p.stock}"></div>
  <div><label>Avisar si quedan</label><input id="kM" type="number" inputmode="numeric" value="${p.min}"></div></div>
  ${id?'':'<div class="mut mt">Lo que pagaste (cantidad × costo) queda registrado como compra de la tienda.</div>'}
  <button class="btn block mt" onclick="saveProd('${id||''}')">Guardar</button>
  ${id?`<button class="btn del block mt" onclick="delItem('productos','${id}')">Eliminar producto</button>`:''}`);
}
function saveProd(id){
  const n=val('kN');if(!n){toast('Falta el nombre');return}
  const o={n,det:val('kD'),costo:+val('kCo')||0,precio:+val('kP')||0,stock:Math.max(0,+val('kS')||0),min:+val('kM')||0};
  if(id)Object.assign(prod(id),o);else{const p={id:uid(),...o};db.productos.push(p);regCompra(p,p.stock,p.costo);if(p.stock)mark('gasto')}
  save();closeSheet();render();toast('✅ Producto guardado');
}
function compraProd(id){const p=prod(id);const cant=Math.floor(+val('kA')||0);if(cant<=0){toast('Ingresa la cantidad');return}
  const cu=+val('kC')||+p.costo||0;p.stock=+p.stock+cant;p.costo=cu;regCompra(p,cant,cu);mark('gasto');
  save();closeSheet();render();toast(`✅ +${cant} ${pn(p)}. Ahora hay ${p.stock}`)}

/* Llegó mercadería: varias líneas de una vez, productos existentes o nuevos. */
function formLlego(){
  openSheet(`<h2 class="goldtxt">📦 Llegó mercadería</h2><div class="mut">Una línea por producto. Elige uno que ya tienes o crea uno nuevo.</div>
  <div id="lineas"></div><button class="btn sec block mt" onclick="addLinea()">+ Otra línea</button>
  <div class="between mt"><span class="mut">Total pagado</span><b id="lT">$0</b></div>
  <button class="btn block mt" onclick="saveLlego()">Guardar todo</button>`);
  addLinea();
}
function addLinea(){
  const P=[...db.productos].sort((a,b)=>pn(a).localeCompare(pn(b)));
  const d=document.createElement('div');d.className='card linea mt';d.style.marginBottom='0';
  d.innerHTML=`<select class="lP" onchange="lineaCambio(this)"><option value="">➕ Producto nuevo</option>${P.map(x=>`<option value="${x.id}">${esc(pn(x))} (hay ${x.stock})</option>`).join('')}</select>
  <div class="lNuevo"><div class="grid2"><div><label>Nombre</label><input class="lN" placeholder="Gorra negra"></div><div><label>Talla / color</label><input class="lD" placeholder="Opcional"></div></div></div>
  <div class="grid3"><div><label>Cantidad</label><input class="lQ" type="number" inputmode="numeric" oninput="totLlego()"></div><div><label>Pagaste c/u</label><input class="lC" type="number" inputmode="numeric" oninput="totLlego()"></div><div><label>Venta c/u</label><input class="lV" type="number" inputmode="numeric"></div></div>`;
  $('#lineas').appendChild(d);
}
function lineaCambio(sel){const d=sel.closest('.linea');const p=prod(sel.value);d.querySelector('.lNuevo').style.display=p?'none':'';
  if(p){d.querySelector('.lC').value=p.costo||'';d.querySelector('.lV').value=p.precio||''}totLlego()}
function totLlego(){let t=0;document.querySelectorAll('.linea').forEach(d=>t+=(+d.querySelector('.lQ').value||0)*(+d.querySelector('.lC').value||0));const e=$('#lT');if(e)e.textContent=money(t)}
function saveLlego(){
  const L=[...document.querySelectorAll('.linea')].map(d=>({pid:d.querySelector('.lP').value,n:d.querySelector('.lN').value.trim(),det:d.querySelector('.lD').value.trim(),
    q:Math.floor(+d.querySelector('.lQ').value||0),c:+d.querySelector('.lC').value||0,v:+d.querySelector('.lV').value||0})).filter(l=>l.q>0&&(l.pid||l.n));
  if(!L.length){toast('Completa al menos una línea con cantidad');return}
  L.forEach(l=>{let p=prod(l.pid);
    if(!p){p={id:uid(),n:l.n,det:l.det,costo:l.c,precio:l.v,stock:0,min:2};db.productos.push(p)}
    else{if(l.c)p.costo=l.c;if(l.v)p.precio=l.v}
    p.stock=+p.stock+l.q;regCompra(p,l.q,l.c)});
  mark('gasto');save();closeSheet();sub.finanzas='inventario';sub.inv='tienda';if(cur!=='finanzas')cur='finanzas';render();
  toast(`✅ ${L.reduce((s,l)=>s+l.q,0)} unidades cargadas`);
}

const _scripts={};
function cargarScript(src){return _scripts[src]||(_scripts[src]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete _scripts[src];ko()};document.head.appendChild(s)}))}

  <button class="btn sec block mt" onclick="exportExcel('${y}')">Año ${y} completo</button>`)}
async function exportExcel(pre){
  toast('Preparando Excel…');
  try{await cargarScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js')}catch(e){toast('⚠️ Necesitas internet para exportar la primera vez');return}
  const R=resumenMes(pre);const D=s=>parseD(s);

    .concat([...R.V].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(v=>{const t=v.tipo==='producto';const tot=v.gratis?0:+v.monto||0;
      return [D(v.fecha),t?'Tienda':'Barbería',(cli(v.clienteId)||{}).nombre||'',v.servicio||'',t?+v.cant||1:1,t?+v.unit||tot:tot,tot,+v.propina||0,t?+v.costo||0:0,tot+(+v.propina||0)-(t?+v.costo||0:0),v.pago||'',v.gratis?'Sí':'']}));
  const gastos=[['Fecha','Tipo','Categoría','Detalle','Monto']].concat([...R.G].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(g=>[D(g.fecha),tipoG[g.tipo]||g.tipo,g.cat||'',g.desc||'',+g.monto||0]));
  const inv=[['Tipo','Producto','Stock','Avisar bajo','Costo c/u','Precio c/u','Valor a costo','Valor a precio venta']]
    .concat(db.productos.map(p=>['Tienda',pn(p),+p.stock,+p.min,+p.costo||0,+p.precio||0,p.stock*(+p.costo||0),p.stock*(+p.precio||0)]))
    .concat(db.inventario.map(i=>['Insumo barbería',i.n,+i.stock,+i.min,'','','','']));
  const titulo=pre.length===4?`Año ${pre}`:`${MES[+pre.slice(5)-1].toUpperCase()} ${pre.slice(0,4)}`;
  const res=[[`King Barber · ${titulo}`],[],['BARBERÍA',''],['Ventas servicios',R.b.ing],['Costos barbería',R.b.cos],['Utilidad barbería',R.b.util],[],
    ['TIENDA',''],['Ventas productos',R.t.ing],['Costo de lo vendido',R.t.cogs],['Otros gastos tienda',R.t.otros],['Ganancia tienda',R.t.util],['Invertido en mercadería',R.t.compras],[],
    ['UTILIDAD TOTAL',R.util],['Gastos personales',R.per],['Te queda',R.util-R.per]];
  if(pre.length===4){res.push([],['MES','Ventas barbería','Utilidad barbería','Ventas tienda','Ganancia tienda','Utilidad total','Gastos personales','Te queda']);
    for(let i=1;i<=12;i++){const r=resumenMes(`${pre}-${pad(i)}`);res.push([MES[i-1].toUpperCase(),r.b.ing,r.b.util,r.t.ing,r.t.util,r.util,r.per,r.util-r.per])}}
  const wb=XLSX.utils.book_new();
  const add=(rows,name,cols,moneyCols)=>{const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true,dateNF:'dd-mm-yyyy'});ws['!cols']=cols.map(w=>({wch:w}));
    const rg=XLSX.utils.decode_range(ws['!ref']);for(let r=1;r<=rg.e.r;r++)for(const c of moneyCols){const cell=ws[XLSX.utils.encode_cell({r,c})];if(cell&&cell.t==='n')cell.z='"$"#,##0'}
    XLSX.utils.book_append_sheet(wb,ws,name)};
  add(res,'Resumen',[28,16,18,16,16,16,18,14],[1,2,3,4,5,6,7]);
  add(ventas,'Ventas',[12,10,20,28,9,12,12,10,10,12,14,7],[5,6,7,8,9]);
  add(gastos,'Gastos',[12,10,16,32,12],[4]);
  add(inv,'Inventario',[16,28,8,11,11,11,14,18],[4,5,6,7]);
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const name=`KingBarber-${pre}.xlsx`;const type='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const file=new File([buf],name,{type});
  closeSheet();
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
}

function triviaPick(){const tv=db.trivia;let pool=TRIVIA.map((_,i)=>i).filter(i=>!tv.usadas.includes(i));
  if(!pool.length){tv.usadas=[];pool=TRIVIA.map((_,i)=>i).filter(i=>i!==tv.cur)}
  tv.cur=pool[Math.floor(Math.random()*pool.length)];tv.usadas.push(tv.cur);tv.res=null;tv.elegida=null;save()}
function triviaCard(hecho){
  const tv=db.trivia;
  if(hecho)return '';
  if(!sub.trivia)return `<button class="btn sec block mt" onclick="sub.trivia=1;render()">🧠 ¿No atendiste hoy? Responde una pregunta</button>`;
  if(tv.cur==null||!TRIVIA[tv.cur])triviaPick();
  const [q,o,a]=TRIVIA[tv.cur];
  return `<div class="mt" style="border-top:1px solid var(--line);padding-top:12px">
    <div class="mut">🧠 Responde bien para sumar el día · ✅ ${tv.ok} · ❌ ${tv.mal}</div>
    <b style="display:block;margin:8px 0 10px;font-size:16px">${esc(q)}</b>
    <div class="grid2">${o.map((x,i)=>{let st='';if(tv.res==='mal'){if(i===a)st='border-color:var(--ok);color:var(--ok)';else if(i===tv.elegida)st='border-color:var(--bad);color:var(--bad)'}
      return `<button class="chip" style="text-align:left;color:var(--txt);${st}" ${tv.res?'disabled':''} onclick="responder(${i})">${esc(x)}</button>`}).join('')}</div>
    ${tv.res==='mal'?`<button class="btn block mt" onclick="triviaPick();render()">🔄 Otra pregunta</button>`:''}</div>`}
function responder(i){const tv=db.trivia;if(tv.res)return;const a=TRIVIA[tv.cur][2];
  if(i===a){tv.ok++;mark('trivia');tv.cur=null;tv.res=null;save();render();const s=streak();toast(`✅ ¡Correcto! Racha de ${s} día${s>1?'s':''} 🔥`)}
  else{tv.mal++;tv.res='mal';tv.elegida=i;save();render();toast('❌ Casi. Prueba con otra')}}
function elegirGasto(){openSheet(`<h2 class="goldtxt">¿Qué gasto?</h2><div class="quick">
  <button onclick="formGasto('negocio')"><span>🧾</span>Costo barbería</button>
  <button onclick="formGasto('personal')"><span>👛</span>Gasto personal</button>
  <button onclick="formLlego()"><span>📦</span>Llegó mercadería</button>
  <button onclick="formGasto('tienda')"><span>👕</span>Otro gasto tienda</button></div>`)}

$('#photoIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=360/Math.max(img.width,img.height);
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    db.fotos.push({fecha:today(),img:c.toDataURL('image/jpeg',.6)});if(db.fotos.length>60)db.fotos.shift();
    mark('foto');save();render();toast('📸 Foto guardada')};img.src=r.result};r.readAsDataURL(f);e.target.value=''});

/* --- Respaldo --- */
/* Respaldo: datos + fotos (siempre) + videos (si se eligen), como base64 dentro del mismo JSON. */
function exportar(){const nv=db.media.filter(m=>m.tipo==='video').length;
  if(!nv)return exportarCon(false);
  openSheet(`<h2 class="goldtxt">💾 Exportar respaldo</h2><div class="mut">Las fotos siempre van incluidas. Hay ${nv} video(s): incluirlos hace el archivo mucho más pesado.</div>
  <button class="btn block mt" onclick="closeSheet();exportarCon(false)">Datos + fotos</button>
  <button class="btn sec block mt" onclick="closeSheet();exportarCon(true)">Datos + fotos + videos</button>`)}
const blobA64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function exportarCon(videos){toast('Preparando respaldo…');db.cfg.ultBackup=today();save();
  const archivos={};let falt=0;
  for(const m of db.media){if(m.tipo==='video'&&!videos)continue;
    try{const b=await idbDo('readonly',st=>st.get(m.id));if(b)archivos[m.id]=await blobA64(b);else falt++}catch(e){falt++}}
  const b=new Blob([JSON.stringify({...db,_archivos:archivos})],{type:'application/json'});const name=`kingbarber-respaldo-${today()}.json`;
  const file=new File([b],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}render();
  toast(`💾 Respaldo listo: ${Object.keys(archivos).length} foto(s)/video(s) · ${(b.size/1048576).toFixed(1)} MB`)}
$('#importIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.clientes||!d.ventas)throw 0;if(!confirm('Esto reemplaza los datos actuales por el respaldo. ¿Seguir?'))return;
    const arch=d._archivos||{};delete d._archivos;
    db=d;for(const k in DEF){if(db[k]===undefined)db[k]=JSON.parse(JSON.stringify(DEF[k]))}for(const k in DEF.cfg){if(db.cfg[k]===undefined)db.cfg[k]=DEF.cfg[k]}migrar();
    restaurarArchivos(arch).then(n=>{const sin=db.media.filter(m=>!arch[m.id]).length;
      db.media=db.media.filter(m=>arch[m.id]||_tiene[m.id]);save();render();
      toast(`✅ Respaldo cargado${n?` · ${n} foto(s)/video(s)`:''}${sin?` · ${sin} sin archivo`:''}`)})}catch(x){toast('Archivo no válido')}};r.readAsText(f);e.target.value=''});
const _tiene={};
async function restaurarArchivos(arch){let n=0;
  for(const m of db.media){try{if(arch[m.id]){const b=await (await fetch(arch[m.id])).blob();await idbDo('readwrite',st=>st.put(b,m.id));delete _urls[m.id];n++}
    else if(await idbDo('readonly',st=>st.get(m.id)))_tiene[m.id]=1}catch(e){}}
  return n}
function borrarTodo(){if(!confirm('¿Borrar TODOS los datos? No se puede deshacer.'))return;if(!confirm('¿Seguro? Exporta un respaldo antes.'))return;
  localStorage.removeItem(KEY);location.reload()}

/* Aviso de respaldo semanal */
if(db.ventas.length>5&&(!db.cfg.ultBackup||diffDays(db.cfg.ultBackup,today())>7))setTimeout(()=>toast('💾 Hace más de 7 días sin respaldo (Finanzas › Ajustes)'),1500);

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* Llegada desde "Compartir" de WhatsApp (Android, app instalada). El service worker deja lo compartido en caché. */
(async()=>{
  const q=new URLSearchParams(location.search);
  if(!q.has('share'))return;
  history.replaceState(null,'',location.pathname);
  go('agenda');
  try{
    const c=await caches.open('kb-share');
    const img=await c.match('shared-image'),txt=await c.match('shared-text');
    await c.delete('shared-image');await c.delete('shared-text');
    if(img){leerCaptura(await img.blob());return}
    if(txt){const t=await txt.text();if(t.trim())pegarWA(t)}
  }catch(e){}
})();
render();
